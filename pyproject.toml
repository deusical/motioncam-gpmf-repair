[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motioncam-gpmf-repair"
version = "0.1.0"
description = "Experimental MotionCam embedded-GPMF timestamp repair for Gyroflow"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Project contributors" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video",
]

[project.scripts]
motioncam-gpmf-repair = "motioncam_gpmf_repair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
