name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and lint tool
        run: python -m pip install -e . ruff
      - name: Lint
        run: python -m ruff check .
      - name: Unit tests (synthetic GPMF, no private footage)
        run: python -m unittest discover -s tests -v
      - name: Smoke test CLI
        run: python -m motioncam_gpmf_repair --help
